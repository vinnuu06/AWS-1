<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 | System Error</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="hero">

        <div class="hero-text">

            <p class="small">SYSTEM ERROR</p>

            <h1>404</h1>

            <h2>PAGE NOT FOUND</h2>

            <p>
                The requested page could not be found.
                The system is still secure.
            </p>

            <a href="index.html" class="btn">
                RETURN TO HOME
            </a>

        </div>

        <div class="terminal">

            <div class="terminal-top">
                ● ● ●
            </div>

            <div class="terminal-body">

                <p>$ system.check</p>

                <p class="green">ERROR: 404</p>

                <p>$ security.status</p>

                <p class="green">SECURE ✓</p>

                <p>$ redirect</p>

                <p class="green">HOME PAGE...</p>

            </div>

        </div>

    </section>

</body>

</html>
